name: ladder-call
description: Chat completion through token-ladder CI lane fallback.
inputs:
  request-file:
    description: JSON chat request (messages, optional max_tokens, response_format).
    required: true
  purpose:
    description: Short label for logs.
    required: true
  require-verdict:
    description: Skip a lane whose answer holds no PASS, PASS+NOTES or FAIL verdict.
    required: false
    default: 'false'
outputs:
  answer-file:
    description: Path to the provider response JSON.
    value: ${{ steps.run.outputs.answer-file }}
  lane:
    description: Lane that answered.
    value: ${{ steps.run.outputs.lane }}
runs:
  using: composite
  steps:
    - name: ladder-call
      id: run
      shell: bash
      env:
        AI_GATEWAY_API_KEY: ${{ env.AI_GATEWAY_API_KEY }}
        OPENCODE_API_KEY: ${{ env.OPENCODE_API_KEY }}
        DEEPSEEK_API_KEY: ${{ env.DEEPSEEK_API_KEY }}
        OPENROUTER_API_KEY: ${{ env.OPENROUTER_API_KEY }}
      run: |
        set -euo pipefail
        tag="$(printf '%s' "${{ inputs.purpose }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-$$-${RANDOM}" | sha256sum | cut -c1-12)"
        answer="${RUNNER_TEMP}/ladder-call-answer-${tag}.json"
        log="${RUNNER_TEMP}/ladder-call-${tag}.log"
        args=(--purpose "${{ inputs.purpose }}")
        if [ "${{ inputs.require-verdict }}" = "true" ]; then
          args+=(--require-verdict)
        fi
        if ! "${{ github.action_path }}/run" "${args[@]}" \
          < "${{ inputs.request-file }}" > "$answer" 2> "$log"; then
          cat "$log" >&2
          exit 1
        fi
        lane=$(sed -n 's/^ladder-call: lane \(\S*\) answered.*/\1/p' "$log" | tail -1)
        echo "answer-file=$answer" >> "$GITHUB_OUTPUT"
        echo "lane=$lane" >> "$GITHUB_OUTPUT"
        cat "$log" >&2