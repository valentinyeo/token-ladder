[package]
name = "token-ladder"
version = "0.1.0"
edition = "2021"
description = "Token Ladder: pool state, tier-first lane picker and fast hooks"

[lib]
name = "token_ladder"
path = "src/lib.rs"

[[bin]]
name = "token-ladder"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3", features = ["json"] }
